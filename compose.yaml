services:
  search:
    build: .
    volumes:
      - ./data:/app/data
    command:
      - python
      - search.py
      - gundam

  index:
    build: .
    volumes:
      - ./data:/app/data
    command:
      - python
      - build_search_index.py

  test:
    build: .
    command:
      - python
      - -m
      - unittest
      - -v
      - test_fuzzy.py
      - test_search_index.py
      - test_vector_search.py
      - test_hybrid_search.py
      - test_server.py

  web:
    build: .
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command:
      - python
      - server.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  crawler:
    build: .
    profiles:
      - crawler
    volumes:
      - ./data:/app/data
    command:
      - python
      - fetch.py
      - --max-products
      - "5"
