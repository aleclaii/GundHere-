services:
  search:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./data:/app/data
    command:
      - python
      - search.py
      - gundam

  index:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./data:/app/data
    command:
      - python
      - build_search_index.py

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - python
      - -m
      - unittest
      - -v
      - test_fuzzy.py
      - test_search_index.py
      - test_vector_search.py
      - test_hybrid_search.py
      - test_server.py

  web:
    build: .
    ports:
      - "8000:8000"

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - crawler
    volumes:
      - ./data:/app/data
    command:
      - python
      - fetch.py
      - --max-products
      - "5"
